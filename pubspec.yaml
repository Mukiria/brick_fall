name: brick_fall
description: "Brick Fall - A classic arcade brick breaking game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Audio
  audioplayers: ^6.4.0

  # Animations
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Utilities
  equatable: ^2.0.7
  collection: ^1.19.0
  intl: ^0.19.0
  uuid: ^4.5.1

  # Responsive
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/